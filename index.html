<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sangjoon's Vibe Coding Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    /* 아코디언 애니메이션용 */
    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
      opacity: 0;
    }
    .accordion-content.open {
      max-height: 1000px;
      opacity: 1;
      transition: max-height 0.4s ease-in, opacity 0.4s ease-in;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

  <!-- 헤더 영역 -->
  <header class="max-w-5xl mx-auto mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-6">
    <div>
      <div class="flex items-center gap-2 text-indigo-400 font-semibold text-sm tracking-wide uppercase mb-1">
        <i class="fa-solid fa-rocket"></i> Vibe Coding Workspace
      </div>
      <h1 class="text-3xl font-extrabold text-white">프로젝트 통합 대시보드</h1>
      <p class="text-slate-400 text-sm mt-1">목표 달성을 위한 동시다발적 프로젝트 관리 시스템</p>
    </div>
    <div>
      <button onclick="openAddModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-medium text-sm transition-all shadow-lg shadow-indigo-500/20 flex items-center gap-2">
        <i class="fa-solid fa-plus"></i> 프로젝트 추가
      </button>
    </div>
  </header>

  <!-- 메인 컨텐츠 -->
  <main class="max-w-5xl mx-auto">
    <!-- 현황 요약 카드 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="glass-card p-4 rounded-2xl border-l-4 border-l-indigo-500">
        <p class="text-xs text-slate-400 font-medium">전체 프로젝트</p>
        <p class="text-2xl font-bold text-white mt-1" id="totalCount">0</p>
      </div>
      <div class="glass-card p-4 rounded-2xl border-l-4 border-l-emerald-500">
        <p class="text-xs text-slate-400 font-medium">진행 중 (Active)</p>
        <p class="text-2xl font-bold text-emerald-400 mt-1" id="activeCount">0</p>
      </div>
      <div class="glass-card p-4 rounded-2xl border-l-4 border-l-amber-500">
        <p class="text-xs text-slate-400 font-medium">아이디어 (Backlog)</p>
        <p class="text-2xl font-bold text-amber-400 mt-1" id="backlogCount">0</p>
      </div>
      <div class="glass-card p-4 rounded-2xl border-l-4 border-l-purple-500">
        <p class="text-xs text-slate-400 font-medium">완료됨 (Done)</p>
        <p class="text-2xl font-bold text-purple-400 mt-1" id="doneCount">0</p>
      </div>
    </div>

    <!-- 프로젝트 목록 컨테이너 (PC에서는 세로로 긴 목록형, 모바일은 반응형 카드) -->
    <div id="projectList" class="space-y-4">
      <!-- JavaScript로 동적 생성됨 -->
    </div>
  </main>

  <!-- 새 프로젝트 추가 모달 -->
  <div id="addModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="glass-card bg-slate-900 border border-slate-700 w-full max-w-lg rounded-2xl p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-5">
        <h3 class="text-xl font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-folder-plus text-indigo-400"></i> 새 프로젝트 추가
        </h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-white text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">프로젝트 제목 *</label>
          <input type="text" id="newTitle" placeholder="예: 6번 프로젝트 (스마트 홈 자동화)" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">시작일자</label>
            <input type="date" id="newStartDate" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">초기 상태</label>
            <select id="newStatus" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
              <option value="Backlog">Backlog (아이디어)</option>
              <option value="Active" selected>Active (진행 중)</option>
              <option value="Done">Done (완료)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">난이도</label>
          <select id="newDifficulty" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
            <option value="초급">초급 🟢</option>
            <option value="초중급" selected>초중급 🟡</option>
            <option value="중고급">중고급 🔴</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">핵심 설명 및 목표</label>
          <textarea id="newDesc" rows="3" placeholder="어떤 프로젝트인지 간단히 설명해주세요." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 resize-none"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-slate-800">
        <button onclick="closeAddModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-sm font-medium transition-colors">취소</button>
        <button onclick="saveNewProject()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium transition-colors">생성하기</button>
      </div>
    </div>
  </div>

  <script>
    // 오늘 날짜 문자열 (YYYY-MM-DD)
    const getTodayStr = () => {
      const d = new Date();
      return d.toISOString().split('T')[0];
    };

    // 기본 프로젝트 데이터 (초기 설치시 제공)
    const initialProjects = [
      {
        id: "p1",
        title: "01. 프로젝트 관리 앱",
        difficulty: "초급",
        status: "Active",
        startDate: "2026-03-01",
        desc: "5개 프로젝트의 목표 성취 및 진행 상황을 한눈에 파악하는 통합 대시보드",
        tasks: [
          { text: "대시보드 UI 디자인 세팅", done: true, date: "2026-03-01" },
          { text: "LocalStorage 자동 저장 기능 연동", done: true, date: "2026-03-02" },
          { text: "목록형 아코디언 및 경과 일수 계산 구현", done: true, date: "2026-03-03" }
        ]
      },
      {
        id: "p2",
        title: "02. 슬승생 (슬기로운 승무원 생활)",
        difficulty: "초중급",
        status: "Active",
        startDate: "2026-03-02",
        desc: "레이오버 시간 효율화: 체크아웃 타이머, 수면/독서 시간 모니터링",
        tasks: [
          { text: "호텔 체크아웃 남은시간 타이머 구현", done: false, date: "2026-03-02" },
          { text: "수면/독서 타임 누적 버튼 UI 제작", done: false, date: "2026-03-02" }
        ]
      },
      {
        id: "p3",
        title: "03. 파일럿 리스폰스 (Pilot Response)",
        difficulty: "중고급",
        status: "Backlog",
        startDate: "2026-03-05",
        desc: "V1 시점 판단 시뮬레이션 게임: Continue vs Reject 의사결정 속도 측정",
        tasks: [
          { text: "V1 판단 타이머 및 무작위 이벤트 로직 짜기", done: false, date: "2026-03-05" }
        ]
      },
      {
        id: "p4",
        title: "04. 스마트 냉장고 & 지출 관리",
        difficulty: "중고급",
        status: "Backlog",
        startDate: "2026-03-05",
        desc: "장보기 카트 지출 추정 + 냉장실/냉동실/팬트리 식자재 재고 관리 앱",
        tasks: [
          { text: "스토어 품목/가격 카트 담기 로직 구현", done: false, date: "2026-03-05" }
        ]
      },
      {
        id: "p5",
        title: "05. 주식 자동매매 스크립트",
        difficulty: "중고급",
        status: "Backlog",
        startDate: "2026-03-05",
        desc: "원하는 매매 조건 설정 후 서버 조건주문 자동 발주 및 알림 발송",
        tasks: [
          { text: "증권사 API 연동 테스트", done: false, date: "2026-03-05" }
        ]
      }
    ];

    let projects = [];
    let openAccordions = {}; // 아코디언 열림 상태 기억

    function init() {
      const saved = localStorage.getItem('vibe_projects_v2');
      if (saved) {
        projects = JSON.parse(saved);
      } else {
        projects = [...initialProjects];
        saveProjects();
      }
      render();
    }

    function saveProjects() {
      localStorage.setItem('vibe_projects_v2', JSON.stringify(projects));
      render();
    }

    // 날짜로부터 경과 일수 계산 (D+N일)
    function getElapsedDays(startDateStr) {
      if (!startDateStr) return 'D+0';
      const start = new Date(startDateStr);
      const today = new Date();
      // 시간 차이를 일(day)로 환산
      const diffTime = today.setHours(0,0,0,0) - start.setHours(0,0,0,0);
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      return diffDays >= 0 ? `D+${diffDays}` : `D-${Math.abs(diffDays)}`;
    }

    function render() {
      const container = document.getElementById('projectList');
      container.innerHTML = '';

      let active = 0, backlog = 0, done = 0;

      projects.forEach(p => {
        if (p.status === 'Active') active++;
        else if (p.status === 'Backlog') backlog++;
        else if (p.status === 'Done') done++;

        const completedTasks = p.tasks.filter(t => t.done).length;
        const totalTasks = p.tasks.length;
        const progressPercent = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;
        const elapsed = getElapsedDays(p.startDate);
        const isOpen = openAccordions[p.id] || false;

        const itemDiv = document.createElement('div');
        itemDiv.className = "glass-card rounded-2xl p-5 transition-all shadow-xl border border-slate-800";
        
        itemDiv.innerHTML = `
          <!-- 프로젝트 헤더 (클릭 시 아코디언 토글) -->
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 cursor-pointer select-none" onclick="toggleAccordion('${p.id}')">
            <div class="flex items-start md:items-center gap-3.5">
              <div class="mt-1 md:mt-0 text-slate-400 text-sm transition-transform duration-300 ${isOpen ? 'rotate-90 text-indigo-400' : ''}" id="arrow-${p.id}">
                <i class="fa-solid fa-chevron-right"></i>
              </div>
              <div>
                <div class="flex flex-wrap items-center gap-2 mb-1">
                  <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full ${getStatusBadge(p.status)}">${p.status}</span>
                  <span class="text-xs text-slate-400 font-medium bg-slate-800/80 px-2 py-0.5 rounded-md">시작일: ${p.startDate || '미지정'} (${elapsed})</span>
                  <span class="text-xs text-slate-400">${p.difficulty}</span>
                </div>
                <h2 class="text-lg font-bold text-white">${p.title}</h2>
                <p class="text-slate-400 text-xs mt-0.5 line-clamp-1">${p.desc}</p>
              </div>
            </div>

            <!-- 우측 진행률 및 상태 변경 -->
            <div class="flex items-center justify-between md:justify-end gap-4 border-t md:border-t-0 pt-3 md:pt-0 border-slate-800/80" onclick="event.stopPropagation()">
              <div class="text-right">
                <div class="text-xs text-slate-400 mb-1">진행도 <span class="text-slate-200 font-bold">${progressPercent}%</span> (${completedTasks}/${totalTasks})</div>
                <div class="w-28 bg-slate-800 rounded-full h-1.5 overflow-hidden inline-block">
                  <div class="bg-indigo-500 h-1.5 rounded-full transition-all duration-300" style="width: ${progressPercent}%"></div>
                </div>
              </div>

              <select onchange="changeStatus('${p.id}', this.value)" class="bg-slate-800 text-xs text-slate-300 border border-slate-700 rounded-lg px-2.5 py-1.5 focus:outline-none">
                <option value="Backlog" ${p.status === 'Backlog' ? 'selected' : ''}>Backlog</option>
                <option value="Active" ${p.status === 'Active' ? 'selected' : ''}>Active</option>
                <option value="Done" ${p.status === 'Done' ? 'selected' : ''}>Done</option>
              </select>

              <button onclick="deleteProject('${p.id}')" class="text-slate-500 hover:text-rose-400 text-xs transition-colors p-1" title="프로젝트 삭제">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>

          <!-- 아코디언 세부 목록 영역 -->
          <div id="content-${p.id}" class="accordion-content ${isOpen ? 'open' : ''}">
            <div class="mt-4 pt-4 border-t border-slate-800/80 space-y-3">
              <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center justify-between">
                <span>세부 태스크 브랜치</span>
                <span class="text-indigo-400 font-normal">클릭하여 완료 체크</span>
              </div>

              <!-- 미완료 태스크 리스트 -->
              <div class="space-y-2">
                ${p.tasks.map((task, idx) => !task.done ? `
                  <div class="flex items-center justify-between bg-slate-900/60 border border-slate-800/80 px-3 py-2.5 rounded-xl group text-xs">
                    <label class="flex items-center gap-2.5 cursor-pointer text-slate-200 hover:text-white select-none overflow-hidden pr-2 flex-1">
                      <input type="checkbox" onchange="toggleTask('${p.id}', ${idx})" class="rounded border-slate-700 text-indigo-600 focus:ring-0 bg-slate-800 w-4 h-4">
                      <span class="truncate">${task.text}</span>
                    </label>
                    <div class="flex items-center gap-3">
                      <span class="text-[10px] text-slate-500 bg-slate-800 px-2 py-0.5 rounded">${task.date || '날짜없음'} (${getElapsedDays(task.date)})</span>
                      <button onclick="deleteTask('${p.id}', ${idx})" class="text-slate-600 hover:text-rose-400 opacity-0 group-hover:opacity-100 transition-opacity">
                        <i class="fa-solid fa-xmark text-sm"></i>
                      </button>
                    </div>
                  </div>
                ` : '').join('')}
              </div>

              <!-- 완료된 태스크 접어보기 (아코디언 내부 토글) -->
              ${p.tasks.some(t => t.done) ? `
                <div class="mt-3 pt-2 border-t border-slate-800/50">
                  <details class="group text-xs">
                    <summary class="cursor-pointer text-slate-400 hover:text-slate-200 py-1 font-medium select-none flex items-center gap-1.5">
                      <i class="fa-solid fa-chevron-right text-[10px] transition-transform group-open:rotate-90"></i>
                      완료된 항목 (${p.tasks.filter(t => t.done).length}개) 접어두기/펼치기
                    </summary>
                    <div class="space-y-2 mt-2 pl-2">
                      ${p.tasks.map((task, idx) => task.done ? `
                        <div class="flex items-center justify-between bg-slate-950/40 border border-slate-900 px-3 py-2 rounded-xl text-xs opacity-75">
                          <label class="flex items-center gap-2.5 cursor-pointer text-slate-400 select-none overflow-hidden pr-2 flex-1">
                            <input type="checkbox" checked onchange="toggleTask('${p.id}', ${idx})" class="rounded border-slate-700 text-indigo-600 focus:ring-0 bg-slate-800 w-4 h-4">
                            <span class="line-through truncate">${task.text}</span>
                          </label>
                          <div class="flex items-center gap-3">
                            <span class="text-[10px] text-slate-600 bg-slate-900 px-2 py-0.5 rounded">${task.date || ''}</span>
                            <button onclick="deleteTask('${p.id}', ${idx})" class="text-slate-600 hover:text-rose-400">
                              <i class="fa-solid fa-xmark text-sm"></i>
                            </button>
                          </div>
                        </div>
                      ` : '').join('')}
                    </div>
                  </details>
                </div>
              ` : ''}

              <!-- 세부 태스크 추가 입력창 -->
              <div class="flex items-center gap-2 mt-3 pt-2">
                <input type="text" id="newTaskInput-${p.id}" placeholder="+ 새로운 세부 태스크 입력 후 엔터" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 flex-1" onkeypress="if(event.key === 'Enter') addTask('${p.id}')">
                <button onclick="addTask('${p.id}')" class="px-3 py-2 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-400 border border-indigo-500/30 rounded-xl text-xs font-medium transition-colors">추가</button>
              </div>

              <!-- AI Context 복사 버튼 -->
              <div class="flex justify-end pt-2">
                <button onclick="copyContext('${p.id}')" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 font-medium bg-indigo-500/10 px-3 py-1.5 rounded-lg border border-indigo-500/20 transition-all">
                  <i class="fa-regular fa-copy"></i> 이 프로젝트 AI Context 복사
                </button>
              </div>
            </div>
          </div>
        `;
        container.appendChild(itemDiv);
      });

      // 요약 수치 업데이트
      document.getElementById('totalCount').innerText = projects.length;
      document.getElementById('activeCount').innerText = active;
      document.getElementById('backlogCount').innerText = backlog;
      document.getElementById('doneCount').innerText = done;
    }

    function getStatusBadge(status) {
      if (status === 'Active') return 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
      if (status === 'Backlog') return 'bg-amber-500/10 text-amber-400 border border-amber-500/20';
      return 'bg-purple-500/10 text-purple-400 border border-purple-500/20';
    }

    // 아코디언 토글
    function toggleAccordion(projId) {
      openAccordions[projId] = !openAccordions[projId];
      render();
    }

    // 모달 관리
    function openAddModal() {
      document.getElementById('newStartDate').value = getTodayStr();
      document.getElementById('addModal').classList.remove('hidden');
      document.getElementById('addModal').classList.add('flex');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('addModal').classList.remove('flex');
      document.getElementById('newTitle').value = '';
      document.getElementById('newDesc').value = '';
    }

    // 신규 프로젝트 생성
    function saveNewProject() {
      const title = document.getElementById('newTitle').value.trim();
      if (!title) {
        alert('프로젝트 제목을 입력해 주세요.');
        return;
      }

      const difficulty = document.getElementById('newDifficulty').value;
      const status = document.getElementById('newStatus').value;
      const startDate = document.getElementById('newStartDate').value || getTodayStr();
      const desc = document.getElementById('newDesc').value.trim() || '목표가 작성되지 않았습니다.';

      const newProj = {
        id: 'p_' + Date.now(),
        title: title,
        difficulty: difficulty,
        status: status,
        startDate: startDate,
        desc: desc,
        tasks: [
          { text: "프로젝트 초기 기획 및 세팅 완료", done: false, date: getTodayStr() }
        ]
      };

      projects.unshift(newProj);
      openAccordions[newProj.id] = true; // 새로 만든 건 바로 펼쳐주기
      saveProjects();
      closeAddModal();
    }

    // 태스크 관리 함수들
    function toggleTask(projId, taskIdx) {
      const proj = projects.find(p => p.id === projId);
      if (proj) {
        proj.tasks[taskIdx].done = !proj.tasks[taskIdx].done;
        saveProjects();
      }
    }

    function addTask(projId) {
      const input = document.getElementById(`newTaskInput-${projId}`);
      const text = input.value.trim();
      if (text) {
        const proj = projects.find(p => p.id === projId);
        if (proj) {
          proj.tasks.push({ text: text, done: false, date: getTodayStr() });
          saveProjects();
        }
      }
    }

    function deleteTask(projId, taskIdx) {
      const proj = projects.find(p => p.id === projId);
      if (proj) {
        proj.tasks.splice(taskIdx, 1);
        saveProjects();
      }
    }

    function deleteProject(projId) {
      if (confirm('정말 이 프로젝트를 삭제하시겠습니까?')) {
        projects = projects.filter(p => p.id !== projId);
        saveProjects();
      }
    }

    function changeStatus(projId, newStatus) {
      const proj = projects.find(p => p.id === projId);
      if (proj) {
        proj.status = newStatus;
        saveProjects();
      }
    }

    function copyContext(projId) {
      const p = projects.find(p => p.id === projId);
      if (!p) return;

      const contextText = `[Project Context]
- 프로젝트명: ${p.title}
- 상태: ${p.status}
- 시작일: ${p.startDate} (${getElapsedDays(p.startDate)})
- 난이도: ${p.difficulty}
- 핵심 목표: ${p.desc}
- 세부 진행 태스크:
${p.tasks.map(t => `  * [${t.done ? 'X' : ' '}] ${t.text} (${t.date})`).join('\n')}`;

      navigator.clipboard.writeText(contextText).then(() => {
        alert(`'${p.title}'의 AI Context가 클립보드에 복사되었습니다!`);
      });
    }

    // 앱 시작
    init();
  </script>
</body>
</html>
